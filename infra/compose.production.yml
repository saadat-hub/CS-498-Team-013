name: prompt-lab
x-runtime: &runtime
  image: ${BACKEND_IMAGE:-prompt-lab-backend:latest}
  env_file: ../.env
  environment:
    NODE_ENV: production
  init: true
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
services:
  release:
    <<: *runtime
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['node', 'dist/packages/db/src/release.js']
    restart: 'no'
  api:
    <<: *runtime
    command: ['node', 'dist/apps/api/src/server.js']
    depends_on:
      release:
        condition: service_completed_successfully
    ports: ['${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:${API_PORT:-8080}']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch(`http://127.0.0.1:${process.env.API_PORT || 8080}/readyz`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  worker:
    <<: *runtime
    command: ['node', 'dist/apps/worker/src/index.js']
    depends_on:
      release:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 90s
