name: Backend checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptlab
          POSTGRES_PASSWORD: promptlab
          POSTGRES_DB: promptlab_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U promptlab -d promptlab_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:services
        env:
          TEST_DATABASE_URL: postgres://promptlab:promptlab@localhost:5432/promptlab_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: docker build -f infra/Dockerfile -t promptlab-backend .
